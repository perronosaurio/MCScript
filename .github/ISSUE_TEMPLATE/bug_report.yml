name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Start the server with ...
        2. Join and run /...
  - type: input
    id: version
    attributes:
      label: MCScript version
      description: Shown when the server starts, or in /serverinfo.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 24.3.0 on Ubuntu 24.04
  - type: input
    id: client
    attributes:
      label: Client
      placeholder: ClassiCube 1.3.8 desktop / web client
  - type: textarea
    id: log
    attributes:
      label: Console output
      description: Errors from the console or logs/. Remove IP addresses and tokens first.
      render: text
